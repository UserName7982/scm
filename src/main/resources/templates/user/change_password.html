<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title})}">

<head>
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-white">
    <div id="content" class="min-h-screen flex flex-col items-center">
        <div th:if="${user}" class="w-full">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
        </div>
        <div class="md:pl-64 w-full max-w-2xl p-4">
            <h1 class="text-center text-4xl font-bold mb-6 text-gray-700 dark:text-gray-200">Change Password</h1>
            <div data-th-replace="message::messagebox"></div>
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <div data-th-if="${user.provider?.toString() != 'SELF'}" class="text-center text-gray-600 dark:text-gray-300">
                    <p>Your account signs in with Google, so there is no password to change here.</p>
                    <a data-th-href="@{'/user/profile'}" class="inline-block mt-4 text-blue-600 underline">Back to profile</a>
                </div>
                <form data-th-if="${user.provider?.toString() == 'SELF'}" data-th-action="@{'/user/profile/password'}"
                    data-th-object="${passwordform}" method="post" class="space-y-4">
                    <div>
                        <label for="currentPassword" class="block mb-1 text-sm font-medium">Current password</label>
                        <input type="password" id="currentPassword" data-th-field="*{currentPassword}" autocomplete="current-password" class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('currentPassword')}" data-th-errors="*{currentPassword}" class="mt-1 text-sm text-red-600"></p>
                    </div>
                    <div>
                        <label for="newPassword" class="block mb-1 text-sm font-medium">New password (6 to 72 characters)</label>
                        <input type="password" id="newPassword" data-th-field="*{newPassword}" autocomplete="new-password" class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('newPassword')}" data-th-errors="*{newPassword}" class="mt-1 text-sm text-red-600"></p>
                    </div>
                    <div>
                        <label for="confirmPassword" class="block mb-1 text-sm font-medium">Confirm new password</label>
                        <input type="password" id="confirmPassword" data-th-field="*{confirmPassword}" autocomplete="new-password" class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('confirmPassword')}" data-th-errors="*{confirmPassword}" class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <div class="flex items-center gap-3 pt-2">
                        <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 transition">Change password</button>
                        <a data-th-href="@{'/user/profile'}" class="text-gray-600 dark:text-gray-300">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
