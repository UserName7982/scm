<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title})}">

<head>
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-white">
    <div id="content" class="min-h-screen flex flex-col items-center">
        <div th:if="${user}" class="w-full">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
        </div>
        <div class="md:pl-64 w-full max-w-2xl p-4">
            <h1 class="text-center text-4xl font-bold mb-6 text-gray-700 dark:text-gray-200">Edit Profile</h1>
            <div data-th-replace="message::messagebox"></div>
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <form data-th-action="@{'/user/profile/edit'}" data-th-object="${profileform}" method="post"
                    enctype="multipart/form-data" class="space-y-4">

                    <div class="text-center">
                        <img th:src="${user.profilepic != null ? user.profilepic : '/images/user.png'}" alt="Profile picture"
                            class="mx-auto rounded-full border-4 border-indigo-600 object-cover" width="110" height="110"
                            onerror="this.src='https://toppng.com/uploads/preview/instagram-default-profile-picture-11562973083brycehrmyv.png'">
                    </div>

                    <div>
                        <label class="block mb-1 text-sm font-medium">Email (cannot be changed)</label>
                        <input type="text" th:value="${user.email}" disabled
                            class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500 bg-gray-100 cursor-not-allowed">
                    </div>

                    <div>
                        <label for="name" class="block mb-1 text-sm font-medium">Name</label>
                        <input type="text" id="name" data-th-field="*{name}" class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('name')}" data-th-errors="*{name}" class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <div>
                        <label for="phoneno" class="block mb-1 text-sm font-medium">Phone number</label>
                        <input type="text" id="phoneno" data-th-field="*{phoneno}" class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('phoneno')}" data-th-errors="*{phoneno}" class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <div>
                        <label for="about" class="block mb-1 text-sm font-medium">About</label>
                        <textarea id="about" rows="4" data-th-field="*{about}" class="w-full p-2.5 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-blue-500 focus:border-blue-500"></textarea>
                        <p data-th-if="${#fields.hasErrors('about')}" data-th-errors="*{about}" class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <div>
                        <label for="picture" class="block mb-1 text-sm font-medium">New profile picture (optional, max 2 MB)</label>
                        <input type="file" id="picture" name="picture" accept="image/*"
                            class="block w-full text-sm border border-gray-300 rounded-lg cursor-pointer dark:bg-gray-700 dark:border-gray-600">
                        <p data-th-if="${#fields.hasErrors('picture')}" data-th-errors="*{picture}" class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <div class="flex items-center gap-3 pt-2">
                        <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 transition">Save changes</button>
                        <a data-th-href="@{'/user/profile'}" class="text-gray-600 dark:text-gray-300">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
