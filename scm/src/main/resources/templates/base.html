<!DOCTYPE html>
<html class="light" lang="en" th:fragment="parent(content,title)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Base page</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.4.1/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" data-th-href="@{'/Css/output.css'}">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            padding-top: 70px;
            /* Adjust based on the height of the navbar */
        }

        .navbar-fixed {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            /* Ensure the navbar is above other content */
        }
    </style>
</head>

<body class="dark:bg-gray-900 bg-gray-100 dark:text-white">
    <div th:if="${user}">
        <div data-th-replace="~{user/user_navbar::user_navbar}" class="navbar-fixed"></div>
    </div>
    
    <div th:unless="${user}">
        <div data-th-replace="~{navbar :: navbar}" class="navbar-fixed"></div>
    </div>

    <div class="p-4 mt-2">
        <section th:replace="${content}">default content</section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.4.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script data-th-src="@{'/js/script.js'}"></script>
    <script data-th-src="@{'/js/admin.js'}"></script>
    <script data-th-src="@{'/js/contact.js'}"></script>
    

</body>

</html>
